spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db_restaurant
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
  sql:
    init:
      mode: always
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

jwt:
  accessSecret: access-token-secret-access-token-secret
  refreshSecret: refresh-token-secret-refresh-token-secret
  accessExpiration: 3600000
  refreshExpiration: 259200000

logging:
  level:
    org:
      springframework:
        security: DEBUG
    com.rbpo_aeroport: DEBUG
    org.hibernate.SQL: DEBUG