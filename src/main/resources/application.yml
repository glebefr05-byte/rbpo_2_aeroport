spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${URL_DB}
    username: ${USER_DB}
    password: ${PASS_DB}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
  sql:
    init:
      mode: always
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

jwt:
  accessSecret: ${ACCESS_SECRET}
  refreshSecret: ${REFRESH_SECRET}
  accessExpiration: ${ACCESS_EXPIRATION}
  refreshExpiration: ${ACCESS_EXPIRATION}

logging:
  level:
    org:
      springframework:
        security: DEBUG
    com.example.rbpo_aeroport: DEBUG
    org.hibernate.SQL: DEBUG
